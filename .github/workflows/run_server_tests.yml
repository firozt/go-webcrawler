name: Run Server Tests And Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.4' 

      - name: Run tests
        working-directory: ./server
        run:  go test -tags "fts5" -v ./...
      - name: SSH into server and deploy
        uses: and-fm/cloudflared-ssh-action@v3.1.2
        with:
          host: ssh.ramizabdulla.me
          username: miz
          private_key_filename: id_ed25519_cf
          private_key_value: ${{ secrets.SSH_PRIVATE_KEY_VALUE }}
          port: 22
          service_token_id: ${{ secrets.SERVICE_CLIENT_ID }}
          service_token_secret: ${{ secrets.SERVICE_CLIENT_SECRET }}
          commands: cd /home/miz/dev/self-host/go-webcrawler
            git pull
            docker compose up -d --build domainsearch_api
             
